# Postgres for the durable run store. `make db-up` starts it, `make db-down`
# stops and removes it. The worker and submit commands read LOUPE_DATABASE_URL
# (defaulted in the Makefile to this instance).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loupe
      POSTGRES_PASSWORD: loupe
      POSTGRES_DB: loupe
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loupe"]
      interval: 2s
      timeout: 3s
      retries: 20
